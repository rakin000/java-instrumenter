plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
}

group = 'com.instrumenter'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // ASM library for bytecode manipulation
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.5'
    implementation 'ch.qos.logback:logback-classic:1.4.6'

    implementation 'org.openjdk.jol:jol-core:0.17'
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2' 


}

application {
    mainClass = 'com.instrumenter.InstrumenterMain'
}

// Task to create the main JAR (includes dependencies)
task instrumenterJar(type: Jar) {
    dependsOn classes
    archiveFileName = 'java-instrumenter.jar'
    duplicatesStrategy = 'EXCLUDE'
    
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    manifest {
        attributes(
            'Main-Class': 'com.instrumenter.InstrumenterMain',
            'Implementation-Title': 'Java Instrumenter',
            'Implementation-Version': version
        )
    }
}

// Task to create the Java agent JAR
task javaAgentJar(type: Jar) {
    dependsOn classes
    archiveFileName = 'java-instrumenter-agent.jar'
    duplicatesStrategy = 'EXCLUDE'
    
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    manifest {
        attributes(
            'Premain-Class': 'com.instrumenter.agent.InstrumenterAgent',
            'Boot-Class-Path': 'java-instrumenter-agent.jar',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Implementation-Title': 'Java Instrumenter',
            'Implementation-Version': version
        )
    }
}

test {
    useJUnitPlatform()
}

build.dependsOn javaAgentJar, instrumenterJar

// ---------------------------------------------------------------------------------------------
// Object tracker agent (sources under src/objecttracker, separate from com.instrumenter.*)
//
// Built as two jars that must sit next to each other:
//   object-tracker-agent.jar  thin agent (Premain/Agent-Class), no dependencies
//   object-tracker-boot.jar   tracker runtime + ASM and Gson relocated under otrack.shaded, appended to the
//                             bootstrap class path so instrumented classes of any loader can call it
// Usage: java -javaagent:build/libs/object-tracker-agent.jar="classes=+a.B;fields=*" ...
// ---------------------------------------------------------------------------------------------
sourceSets {
    otrackBoot {
        java.srcDir 'src/objecttracker/boot'
    }
    otrackAgent {
        java.srcDir 'src/objecttracker/agent'
    }
    otrackTools {
        java.srcDir 'tools'
    }
}

dependencies {
    otrackBootImplementation 'org.ow2.asm:asm:9.7'
    otrackBootImplementation 'org.ow2.asm:asm-commons:9.7'
    otrackBootImplementation 'org.ow2.asm:asm-tree:9.7'
    // error_prone_annotations are compile-time only; left out so they are not put on the bootstrap path
    otrackBootImplementation('com.google.code.gson:gson:2.13.1') { exclude group: 'com.google.errorprone' }
    otrackToolsImplementation 'org.ow2.asm:asm:9.7'
    otrackToolsImplementation 'org.ow2.asm:asm-commons:9.7'
}

tasks.named('compileOtrackBootJava') { options.release = 21 }
tasks.named('compileOtrackAgentJava') { options.release = 21 }
tasks.named('compileOtrackToolsJava') { options.release = 21 }

def otrackShadedDir = layout.buildDirectory.dir('otrack-shaded')

// Relocates ASM and Gson under otrack.shaded across the tracker classes and the library jars (see tools/Shade.java)
task shadeOtrackBoot(type: JavaExec) {
    dependsOn 'compileOtrackBootJava', 'compileOtrackToolsJava'
    classpath = sourceSets.otrackTools.output + sourceSets.otrackTools.runtimeClasspath
    mainClass = 'Shade'
    notCompatibleWithConfigurationCache('args are computed at execution time from the source set classpaths')
    inputs.files sourceSets.otrackBoot.output, sourceSets.otrackBoot.runtimeClasspath
    outputs.dir otrackShadedDir
    doFirst {
        delete otrackShadedDir
        args = [otrackShadedDir.get().asFile.path] +
                sourceSets.otrackBoot.output.classesDirs.files.collect { it.path } +
                sourceSets.otrackBoot.runtimeClasspath.files.findAll { it.name.endsWith('.jar') }.collect { it.path }
    }
}

task otrackBootJar(type: Jar) {
    dependsOn shadeOtrackBoot
    archiveFileName = 'object-tracker-boot.jar'
    from otrackShadedDir
}

task otrackAgentJar(type: Jar) {
    dependsOn 'compileOtrackAgentJava'
    archiveFileName = 'object-tracker-agent.jar'
    from sourceSets.otrackAgent.output
    manifest {
        attributes(
            'Premain-Class': 'otrack.agent.Agent',
            'Agent-Class': 'otrack.agent.Agent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Implementation-Title': 'Object Tracker',
            'Implementation-Version': version
        )
    }
}

task objectTrackerJars {
    group = 'build'
    description = 'Builds object-tracker-agent.jar and object-tracker-boot.jar into build/libs'
    dependsOn otrackAgentJar, otrackBootJar
}

build.dependsOn objectTrackerJars
